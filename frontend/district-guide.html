<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>District guide | BinGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="has-bottom-nav page-bottom-lime">
  <main class="container">

    <header class="page-head">
      <p class="eyebrow" id="guide-eyebrow">Change your district</p>
      <h1>Check your district<br>rules</h1>
    </header>

    <ul class="list rule-list" id="rule-list">
      <li class="list-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="grow" id="rule-time">18:00~24:00</span></li>
      <li class="list-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></svg><span class="grow" id="rule-bag">Use Transparent bag</span></li>
      <li class="list-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3h4v3l1.5 2.5V20a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V8.5L10 6z"/></svg><span class="grow" id="rule-note">Pet bottles in separate bag</span></li>
    </ul>

    <a class="btn btn-block" id="open-dong" href="#dong">Check rules of your dong</a>

  </main>

  <div class="modal" id="dong">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dong-title">
      <div class="modal-head"><h2 id="dong-title">Check rules of<br>your dong</h2><a class="modal-close" href="district-guide.html" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a></div>
      <p class="muted">Click your dong and find out more</p>
      <div class="check-list" id="dong-list">
        <label class="check-item"><input type="radio" name="dong" checked> Gongdeok-dong</label>
        <label class="check-item"><input type="radio" name="dong"> Ahyeon-dong</label>
        <label class="check-item"><input type="radio" name="dong"> Seogyo-dong</label>
      </div>
      <div class="modal-actions"><a class="btn btn-secondary" href="district-guide.html">Not sure</a><a class="btn" href="dong-rules.html">Confirm</a></div>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="Main"><a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg><span>Home</span></a><a href="items.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Search</span></a><a href="photo.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Camera</span></a><a href="mypage.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"/></svg><span>My Page</span></a></nav>
</body>
</html>
