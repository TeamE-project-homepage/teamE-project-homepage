<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | BinGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="page-auth">
  <main class="container">
    <!-- The form fields have no name attribute on purpose: nothing (password included) is ever sent in the address bar.
         The JavaScript reads the values by id. -->
    <div class="auth-wrap">

      <header class="brand">
        <svg class="brand-logo" viewBox="0 0 52 44" aria-hidden="true"><rect width="52" height="44" rx="14" fill="#111111"/><rect x="11" y="18" width="7" height="16" rx="3.5" fill="#a0ca68"/><rect x="22.5" y="10" width="7" height="24" rx="3.5" fill="#a0ca68"/><rect x="34" y="16" width="7" height="18" rx="3.5" fill="#a0ca68"/></svg>
        <p class="eyebrow">Sort it right</p>
        <h1>BinGo</h1>
        <p class="lead">A simple guide for everyday waste.</p>
      </header>

      <section class="auth-card" id="signup" aria-labelledby="signup-title">
        <div class="tabs"><a href="#signup" aria-current="page">Sign up</a><a href="#login">Log in</a></div>
        <h2 id="signup-title">Create your account</h2>
        <p class="muted">Start sorting with confidence.</p>
        <form id="signup-form" action="mypage.html">
          <div class="field"><label for="signup-name">Name</label><input id="signup-name" type="text" placeholder="Your name" autocomplete="name" required></div>
          <div class="field"><label for="signup-email">Email</label><input id="signup-email" type="email" placeholder="you@email.com" autocomplete="email" required></div>
          <div class="field"><label for="signup-password">Password</label><input id="signup-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required><span class="error" id="signup-error" role="alert" hidden></span></div>
          <button class="btn btn-block" type="submit">Create account</button>
        </form>
      </section>

      <section class="auth-card" id="login" aria-labelledby="login-title">
        <div class="tabs"><a href="#signup">Sign up</a><a href="#login" aria-current="page">Log in</a></div>
        <h2 id="login-title">Welcome back</h2>
        <p class="muted">Log in to continue to BinGo.</p>
        <form id="login-form" action="mypage.html">
          <div class="field"><label for="login-email">Email</label><input id="login-email" type="email" placeholder="you@email.com" autocomplete="email" required></div>
          <div class="field"><label for="login-password">Password</label><input id="login-password" type="password" placeholder="At least 8 characters" autocomplete="current-password" required><span class="error" id="login-error" role="alert" hidden></span></div>
          <button class="btn btn-block" type="submit">Log in</button>
        </form>
      </section>

      <p class="center"><a class="text-link" href="index.html">Continue as guest</a></p>

    </div>
  </main>


</body>
</html>
