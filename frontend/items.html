<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item list | BinGo</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
    <script defer src="js/mock-data.js"></script>
  <script defer src="js/items.js"></script>
</head>
<body class="has-bottom-nav">
  <header class="site-header container">
    <a class="logo" href="index.html">BinGo</a>
    <a class="btn btn-secondary" href="login.html">Log in</a>
  </header>

  <main class="container">

    <p><a href="index.html">&larr; Back</a></p>
    <div class="district-bar"><span>District: (selected district)</span><a href="district.html">Change</a></div>
    <h1 id="items-title">Category name</h1>
    <form class="search-form" action="items.html" role="search"><input type="search" name="q" placeholder="Search items" aria-label="Search items"><button class="btn" type="submit">Go</button></form>
    <p class="section" id="items-count"></p>
    <div class="grid grid-4" id="item-grid"></div>

    <section class="section" id="items-empty" hidden>
      <div class="state" role="status">
        <p id="items-empty-text"></p>
        <p><a href="index.html">Browse categories</a></p>
      </div>
    </section>

  </main>

  <footer class="site-footer container">
    <p>Footer: disclaimer text, repository link</p>
  </footer>

  <nav class="bottom-nav" aria-label="Main"><a href="index.html">Home</a><a href="items.html" aria-current="page">Search</a><a href="mypage.html">My Page</a></nav>
  <script src="js/common.js"></script>
</body>
</html>
