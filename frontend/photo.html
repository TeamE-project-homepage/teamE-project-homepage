<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo upload | BinGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script defer src="js/photo.js"></script>
</head>
<body class="has-bottom-nav page-bottom-lime">
  <main class="container">

    <p><a href="index.html">&larr; Back</a></p>
    <h1>Photo upload</h1>
    <div class="dropzone">
      <p>Upload a photo of one item at a time.</p>
      <label class="btn" for="photo">Choose photo</label>
      <input id="photo" class="visually-hidden" type="file" accept="image/*">
    </div>

    <section class="section">
      <h2>Preview</h2>
      <div class="preview" id="photo-preview">No photo selected</div>
      <div class="cluster"><button class="btn" type="button" id="analyse-button" disabled>Analyse</button><label class="btn btn-secondary" for="photo">Choose another</label></div>
    </section>

    <section class="section">
      <div class="state" id="photo-loading" role="status" hidden><p>Analysing your photo...</p></div>
      <div class="state" id="photo-error" role="alert" hidden>
        <p id="photo-error-text"></p>
        <p><a href="items.html">Search by name instead</a></p>
      </div>
    </section>

  </main>

  <footer class="site-footer container">
    <p>Footer: disclaimer text, repository link</p>
  </footer>

  <nav class="bottom-nav" aria-label="Main"><a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg><span>Home</span></a><a href="items.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Search</span></a><a href="photo.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Camera</span></a><a href="mypage.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"/></svg><span>My Page</span></a></nav>
</body>
</html>
