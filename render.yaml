services:
  - type: web
    name: bingo-backend
    runtime: image
    plan: free
    # GitHub Actions builds and pushes this image, then triggers the deploy hook.
    image:
      url: ghcr.io/teame-project-homepage/bingo-backend:latest
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
