<html lang="en">
<head>

    <div class="district-bar"><span>District: (selected district)</span><a href="district.html">Change</a></div>

      <p class="eyebrow">Welcome to BinGo</p>

    <form class="search-form" action="items.html" role="search">
      <input type="search" name="q" placeholder="e.g. plastic bottle" aria-label="Search items in English">

      <div class="section-head"><h2>Browse categories</h2><a class="text-link" href="items.html">View all</a></div>

    </aside>
